name: CI

# Runs on every pull request. No deploy, no push (publishing lives in
# publish.yml and is release-triggered only). Branch protection on main
# requires this workflow to pass — see docs/SECURITY-BASELINE.md.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

      - name: Versions-Sync (pyproject ↔ server.json / README / src)
        run: python scripts/check_version_sync.py

  audit:
    runs-on: ubuntu-latest
    # Alarm, don't block: a fresh advisory in a transitive dependency should
    # show up red here without blocking every unrelated PR (the `check`
    # matrix stays the required gate). Tighten to blocking once a clean
    # baseline has held for a while.
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: pip-audit
        run: uv run --with pip-audit pip-audit
