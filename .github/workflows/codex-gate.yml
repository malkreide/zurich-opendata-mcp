# Macht den Codex-Review zu einem Check statt zu einer Checkbox.
#
# Warum: Zwischen dem 18. und 20.9.2026 wurde die Zeile «Codex-Review
# beantwortet» in diesem Repo viermal in Folge formal gesetzt und faktisch
# leer gelassen; dreimal begann der Review erst NACH dem Merge. Der Ablauf
# lässt vier Sekunden zwischen «ready for review» und Merge zu, der Review
# braucht zwei bis drei Minuten. Ein Text, den man zum Merge-Zeitpunkt lesen
# müsste, wird zum Merge-Zeitpunkt nicht gelesen.
#
# Dieser Workflow meldet einen Check-Run mit festem Namen (siehe CHECK_NAME).
# Erst wenn der als Required Status Check in einem Ruleset eingetragen ist,
# blockiert er tatsächlich — das ist eine Repo-Einstellung und kann aus einem
# PR heraus nicht gesetzt werden. Ohne diesen Schritt ist der Workflow nur
# eine sichtbare Anzeige.
#
# Der Check wird über die Checks-API gemeldet und nicht über den Job-Status:
# `issue_comment` und `pull_request_review` laufen nicht am Head-SHA des PR,
# ihr Job-Status landet also nirgends, wo ein Ruleset ihn sieht. Über die API
# hängt jede Auslösung denselben Namen an denselben SHA.

name: Codex-Verdikt

on:
  # Erster Anlauf: sobald der PR reviewfähig ist. Ergebnis hier ist fast immer
  # rot — das ist der Zweck, nicht ein Fehler.
  #
  # Nur für PRs aus diesem Repo. Bei einem PR AUS EINEM FORK gibt GitHub dem
  # `pull_request`-Lauf einen Nur-Lese-Token, und der `permissions:`-Block
  # unten kann das nicht aufheben: der POST auf die Checks-API endet mit 403,
  # der alte rote Check bleibt stehen — ausgerechnet auch dann, wenn jemand
  # den Notausgang «codex-review-waived» setzt. Deshalb der zweite Trigger.
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize, labeled, unlabeled]
  # Nur für PRs aus einem Fork. `pull_request_target` läuft im Kontext des
  # Basis-Branch und bekommt den normalen Token.
  #
  # Das ist hier die sichere Variante dieses sonst heiklen Triggers: Der Job
  # checkt einen ausdrücklich gesetzten Ref aus (siehe beim Checkout-Schritt)
  # und führt damit keinen Code aus dem Fork aus. Was aus dem PR kommt —
  # Kommentar- und Review-Texte — wandert als JSON ins Skript, nie in eine
  # Shell-Zeile; es
  # gibt keine `${{ }}`-Einsetzung von Fremdtext. Ein Fork kann die
  # Entscheidungslogik damit auch nicht zu seinen Gunsten ändern: es gilt das
  # `check_codex_verdict.py` des Basis-Branch.
  pull_request_target:
    types: [opened, ready_for_review, reopened, synchronize, labeled, unlabeled]
  # Die befundlose Meldung und die beiden Ausfallmeldungen sind gewöhnliche
  # Issue-Kommentare. `edited` ist mitgenommen, weil Codex seine
  # Summary-Tabelle in place editiert; ob ein Bot-Selbst-Edit dieses Ereignis
  # auslöst, sagt die GitHub-Dokumentation nicht, und der Entwurf hängt
  # deshalb nicht daran: Verdikte kommen als NEUER Kommentar oder als
  # Review-Objekt, beide lösen sicher aus.
  issue_comment:
    types: [created, edited]
  # Ein Befund ist ein Review-Objekt, kein Kommentar.
  pull_request_review:
    types: [submitted, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write

jobs:
  verdikt:
    name: Codex-Verdikt ermitteln
    runs-on: ubuntu-latest

    # Bewusst auf JOB-Ebene, nicht auf Workflow-Ebene.
    #
    # `pull_request_target` feuert für JEDEN PR, nicht nur für Forks; für
    # dieselbe Aktion entstehen also immer zwei Läufe. Stünde die Gruppe
    # oben, träten beide ihr bei — sie wird ausgewertet, bevor der `if`
    # unten je gelesen wird. Mit `cancel-in-progress` könnte dann der Lauf
    # gewinnen, dessen Job der Filter gleich darauf überspringt: kein Job,
    # kein POST, gar kein Check. Bei einem Fork träfe das ausgerechnet den
    # Notausgang.
    #
    # Auf Job-Ebene tritt der übersprungene Lauf der Gruppe nie bei. Es
    # bleibt bei einem Urteil pro PR, und zwar dem des Laufs, der auch
    # handelt. Befund eines Codex-Reviews auf PR #119.
    concurrency:
      group: codex-verdikt-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    # Auf Issues, die keine PRs sind, gibt es nichts zu prüfen. Und die
    # beiden PR-Trigger teilen sich die Arbeit strikt nach Herkunft, damit
    # kein PR doppelt bewertet wird: `pull_request` für dieses Repo,
    # `pull_request_target` für Forks UND für Dependabot.
    #
    # Dependabot ist der unscheinbare Fall: Sein Branch liegt in diesem Repo,
    # die Herkunftsprüfung allein schickt ihn also auf den `pull_request`-Pfad
    # — aber GitHub behandelt von Dependabot ausgelöste Ereignisse wie
    # Fork-Ereignisse und gibt einen Nur-Lese-Token. Der POST endet mit 403,
    # und unter einem Required Check waere jeder woechentliche Dependabot-PR
    # dauerhaft blockiert, Notausgang eingeschlossen. Dieses Repo erzeugt
    # zwei solche PRs pro Woche (`.github/dependabot.yml`: github-actions und
    # pip). Befund eines Codex-Reviews auf PR #119.
    #
    # Geprüft wird der PR-AUTOR und nicht `github.actor`: Wer das Label setzt,
    # wechselt, die Herkunft des PR nicht. So bleibt die Zuordnung stabil, und
    # es läuft in jedem Fall genau einer der beiden Pfade.
    #
    # `issue_comment` und `pull_request_review` tragen bei jeder Herkunft
    # einen vollen Token und brauchen die Unterscheidung hier nicht — wohl
    # aber beim Checkout: `pull_request_review` läuft NICHT im Basis-Kontext,
    # sondern am PR-Merge-Ref. Das steht dort.
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null) ||
      github.event_name == 'pull_request_review' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'pull_request_target' &&
       (github.event.pull_request.head.repo.full_name != github.repository ||
        github.event.pull_request.user.login == 'dependabot[bot]'))

    env:
      CHECK_NAME: Codex-Verdikt
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
      REPO: ${{ github.repository }}

    steps:
      # ZUERST den Check auf «läuft» setzen, vor allem Fehlbaren.
      #
      # Ein Required Status Check richtet sich nach dem JÜNGSTEN Check-Run
      # dieses Namens auf dem Head. Wurde der Notausgang `codex-review-waived`
      # gesetzt und dann wieder entfernt, steht dort weiterhin das Grün des
      # Waivers — der Head hat sich ja nicht geändert. Bis zum POST am Ende
      # dieses Jobs bliebe der PR also mergebar, und scheiterte davor ein
      # Schritt (Checkout, Python, eine der API-Abfragen), bliebe das Grün
      # DAUERHAFT stehen: Der Job-Fehlschlag trägt den Namen «Codex-Verdikt
      # ermitteln» und nicht den des Required Checks.
      #
      # Das ist der einzige bisher gefundene Fall, in dem dieser Gate OFFEN
      # statt geschlossen ausfällt. Deshalb wird hier zuerst ein Check-Run
      # mit `status: in_progress` angelegt — ein solcher gilt nicht als
      # bestanden — und derselbe Run am Ende per PATCH abgeschlossen.
      #
      # Restrisiko, das bleibt: Scheitert schon dieser Schritt, entsteht kein
      # neuer Run, und ein älteres Grün auf demselben Head bliebe stehen. Das
      # lässt sich nicht ganz beseitigen — irgendetwas muss laufen, um den
      # Check zu setzen —, aber das Fenster ist damit auf einen einzigen,
      # minimalen Schritt geschrumpft. Befund eines Codex-Reviews auf PR #119.
      - name: Check als «läuft» anlegen
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Bei `issue_comment` steht der Head nicht im Ereignis; nur dann
          # kostet es eine Abfrage.
          HEAD_SHA="$EVENT_HEAD_SHA"
          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA="$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)"
          fi

          CHECK_ID="$(jq -n --arg n "$CHECK_NAME" --arg s "$HEAD_SHA" \
            '{name:$n, head_sha:$s, status:"in_progress",
              output:{title:"Verdikt wird ermittelt",
                      summary:"Der Gate prueft gerade, ob fuer diesen Head ein Codex-Verdikt vorliegt. Bis dahin gilt er als nicht bestanden."}}' \
            | gh api --method POST "repos/$REPO/check-runs" --input - --jq .id)"

          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "CHECK_ID=$CHECK_ID" >> "$GITHUB_ENV"
          echo "Head $HEAD_SHA, Check-Run $CHECK_ID auf in_progress."

      # Den auszucheckenden Stand AUSDRÜCKLICH festlegen. Ohne `ref` richtet
      # sich der Checkout nach dem Ereignis — am 20.9.2026 an Lauf
      # 35514764426 im Log abgelesen:
      #
      #     git checkout --force refs/remotes/pull/119/merge
      #     HEAD is now at 18595a4 Merge 601d2214… into a8023ab2…
      #
      # Bei `pull_request_review` ist die Vorgabe also der PR-MERGE-REF und
      # enthält bei einem Fork-PR Fork-Code — während der Token dieses
      # Ereignisses `checks: write` trägt, denn nur `pull_request` wird bei
      # Forks auf Nur-Lesen heruntergestuft. Wer dort ungefiltert auscheckt,
      # führt `check_codex_verdict.py` in der Fassung des Forks aus und lässt
      # ihn sein eigenes grünes `Codex-Verdikt` schreiben. Der Gate wäre
      # damit von genau dem umgehbar, den er prüfen soll.
      #
      # Entschieden wird daran, ob der HEAD vertrauenswürdig ist — nicht
      # daran, welcher Trigger gerade zuständig ist. Vertrauenswürdig heisst:
      # aus diesem Repo und nicht von Dependabot; wer so einen Branch pusht,
      # hat Schreibrecht, und der Gate prüft sich damit auf seinem eigenen PR.
      # Sonst die Basis. Bei `issue_comment` gibt es kein
      # `pull_request`-Objekt; dort greift `github.ref`, das bereits auf den
      # Default-Branch zeigt.
      #
      # Hier stand kurzzeitig `github.event_name == 'pull_request'` — eine
      # scheinbare Vereinfachung, weil der `if` oben ja schon filtert. Sie
      # war falsch und hat den Gate sofort lahmgelegt: Ein
      # `pull_request_review` auf einem PR AUS DIESEM REPO landete damit auf
      # der Basis, und dort liegt `check_codex_verdict.py` erst nach dem
      # Merge. Gemessen an Lauf 35515251744:
      #
      #     python: can't open file '…/scripts/check_codex_verdict.py'
      #
      # Welcher Trigger zuständig ist und ob der Head vertrauenswürdig ist,
      # sind zwei verschiedene Fragen. Nur die zweite gehört hierher.
      #
      # Befund eines Codex-Reviews auf PR #119. Die frühere Begründung, der
      # Job erhalte «ohne `ref` den Basis-Stand», galt nur für
      # `pull_request_target` und wurde fälschlich verallgemeinert.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: >-
            ${{ ((github.event.pull_request.head.repo.full_name == github.repository
                  && github.event.pull_request.user.login != 'dependabot[bot]')
                 && github.event.pull_request.head.sha)
                || github.event.pull_request.base.sha
                || github.ref }}
          # Nichts wird gepusht, und ein privilegierter Lauf soll den Token
          # nicht in der git-Konfiguration liegen lassen.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: PR-Zustand einsammeln
        run: |
          set -euo pipefail
          # Head-SHA und Labels aus dem PR selbst. Nicht aus dem Ereignis:
          # bei `issue_comment` steht der Head dort gar nicht drin, und bei
          # den übrigen wäre er womöglich schon überholt.
          gh api "repos/$REPO/pulls/$PR" > pr.json
          gh api --paginate "repos/$REPO/issues/$PR/comments" > comments.json
          gh api --paginate "repos/$REPO/pulls/$PR/reviews"   > reviews.json

          python - <<'PY' > event.json
          import json, os, pathlib

          def read_all(name):
              """Alle JSON-Werte der Datei, flach.

              `gh api --paginate` haengt bei mehreren Seiten MEHRERE Arrays
              aneinander — das ist kein gueltiges JSON-Dokument, und ein
              blosses `json.loads` wirft darauf. Ab der 31. Anmerkung (die
              Seitengroesse ist 30) waere der Gate damit still kaputt. Ein
              `raw_decode`-Lauf frisst beide Formen, die eine Seite wie die
              vielen, und bleibt unabhaengig von der gh-Version.
              """
              text = pathlib.Path(name).read_text(encoding="utf-8").strip()
              decoder, out, i = json.JSONDecoder(), [], 0
              while i < len(text):
                  value, end = decoder.raw_decode(text, i)
                  out.extend(value if isinstance(value, list) else [value])
                  i = end
                  while i < len(text) and text[i].isspace():
                      i += 1
              return out

          pr = json.loads(pathlib.Path("pr.json").read_text(encoding="utf-8"))
          print(json.dumps({
              # Derselbe Head wie im angelegten Check-Run — eine Quelle, damit
              # Urteil und Check nicht auf verschiedene Commits zeigen koennen.
              "head_sha": os.environ["HEAD_SHA"],
              "labels": [label["name"] for label in pr.get("labels") or []],
              "comments": read_all("comments.json"),
              "reviews": read_all("reviews.json"),
          }))
          PY

          python -c "import json;print('head:', json.load(open('event.json'))['head_sha'])"

      - name: Urteilen und als Check melden
        run: |
          set -uo pipefail
          if OUT="$(python scripts/check_codex_verdict.py --event event.json 2>&1)"; then
            CONCLUSION=success
          else
            CONCLUSION=failure
          fi
          # Ein Check ohne Begruendung ist fast so schlecht wie keiner. Faellt
          # das Skript aus (etwa weil es im ausgecheckten Stand fehlt), stand
          # hier vorher eine leere Zusammenfassung — gemessen an Lauf
          # 35515251744.
          if [ -z "${OUT//[[:space:]]/}" ]; then
            CONCLUSION=failure
            OUT="BLOCKIERT: check_codex_verdict.py lieferte keine Ausgabe. Der Gate faellt geschlossen aus, aber die Ursache liegt im Workflow und nicht im Verdikt — Lauf-Log ansehen."
          fi
          echo "$OUT"

          TITLE="$( [ "$CONCLUSION" = success ] && echo 'Verdikt liegt vor' || echo 'Kein Verdikt fuer diesen Head' )"

          # PATCH auf den Run, der oben schon als «läuft» angelegt wurde —
          # kein zweiter Run. So gibt es zu keinem Zeitpunkt ein veraltetes
          # Grün neben einem laufenden Urteil.
          # Der POST wird AUSDRUECKLICH geprueft. Gemessen traegt dieser Step
          # `bash -e` (im Log: `shell: /usr/bin/bash -e {0}`), ein
          # fehlschlagendes `gh` braeche ihn also ohnehin ab — aber diese
          # Eigenschaft haengt dann an einem impliziten Flag, das ein
          # `set +e` oder ein `shell:`-Override still entfernt. Bei einem
          # Gate ist «faellt geschlossen aus» zu wichtig, um implizit zu
          # bleiben. Angeregt durch einen Codex-Review auf PR #119; dessen
          # Begruendung (`-e` sei nicht aktiv) trifft nicht zu, der Rat
          # schon.
          if ! jq -n --arg c "$CONCLUSION" --arg t "$TITLE" --arg o "$OUT" \
               '{status:"completed", conclusion:$c,
                 output:{title:$t, summary:$o}}' \
               | gh api --method PATCH "repos/$REPO/check-runs/$CHECK_ID" --input -
          then
            echo "::error::Check-Run konnte nicht veroeffentlicht werden — das Urteil lautete: $OUT"
            exit 1
          fi

          [ "$CONCLUSION" = success ]
