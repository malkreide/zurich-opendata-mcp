[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "zurich-opendata-mcp"
version     = "0.7.0"
description = "MCP Server for City of Zurich Open Data — 23 tools for CKAN, geodata, parliament, council resolutions, tourism, and real-time data across 6 APIs"
readme      = "README.md"
license     = { file = "LICENSE" }
requires-python = ">=3.11"

keywords = [
    "mcp", "model-context-protocol", "open-data", "zurich",
    "ckan", "stadt-zuerich", "geodata", "wfs", "sparql",
    "linked-data", "smart-city",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    # Now on the 2.x API (`mcp.server.mcpserver`). The floor is hard: 2.0.0
    # removed `mcp.server.fastmcp` with no compatibility shim, so this code
    # cannot run on 1.x — a `>=1.x` range would let a resolver pick a version
    # that fails at import. The `<3` cap stays for the reason the old `<2` one
    # existed: a major bump is a decision to take on purpose, not one a
    # resolver makes silently.
    # Existing clients see no difference: the legacy `initialize` handshake
    # still caps at 2025-11-25 (measured — a client asking for 2026-07-28 gets
    # 2025-11-25 back). mcp 2.x additionally serves a "modern" per-request
    # envelope era that reaches 2026-07-28, so a 2.x-aware client negotiates
    # the newer revision. Not a break, but not a protocol no-op either.
    "mcp[cli]>=2.0.0,<3",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "uvicorn>=0.46.0",
    # Floor auf 0.6.0: 0.5.5 traegt CVE-2026-71491, -59894, -59893 und
    # -54284, alle in 0.6.0 behoben. Der Floor, nicht bloss der Lock:
    # `uv.lock` gilt nur hier, ein Fremdinstall loest aus der Spanne auf
    # und darf die verwundbaren Versionen gar nicht erst ziehen duerfen.
    # sqlparse ist keine Randabhaengigkeit — der SQL-Guard in
    # tools/datastore.py parst damit.
    "sqlparse>=0.6.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    # Exakt gepinnt, nicht als Spanne: ruff ist ein Gate, kein Hilfsmittel.
    # Der Pin steht hier und nur hier — `ci.yml` rief ruff vorher per
    # `uv run --with ruff==0.16.1` auf, während `uv.lock` auf 0.15.18 stand.
    # Wer lokal `uv run ruff check` fuhr, lintete damit mit einer anderen
    # Version als das Gate. Beim Anheben: Version hier ändern, `uv lock`
    # laufen lassen, `ruff format` über src/ tests/ scripts/, alles zusammen
    # committen.
    "ruff==0.16.1",
    "mypy>=1.18.2",
]

[project.scripts]
zurich-opendata-mcp = "zurich_opendata_mcp.server:main"

[tool.mcp_auditor.boot.commands]
# How an external auditor starts this server per transport. Declared because
# the transport is chosen by CLI flag, not by environment variable, so a
# harness cannot boot the HTTP path by setting an env var alone. `{port}` is
# substituted by the auditor. The HTTP command deliberately omits `--host`:
# the loopback default is what an auditor should exercise, and it is also the
# only bind for which the Host allow-list is enabled without further config.
"stdio" = ["zurich-opendata-mcp"]
"streamable-http" = ["zurich-opendata-mcp", "--http", "--port", "{port}"]

[project.urls]
Homepage   = "https://github.com/malkreide/zurich-opendata-mcp"
Repository = "https://github.com/malkreide/zurich-opendata-mcp"
Issues     = "https://github.com/malkreide/zurich-opendata-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/zurich_opendata_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
# Coverage gate (audit M-7): freeze the current floor and ratchet it upward
# as `respx` round-trip coverage grows. Measured on the non-live suite, so it
# excludes the `live`-marked API tests.
addopts      = "-v --tb=short -m 'not live' --cov=zurich_opendata_mcp --cov-report=term-missing --cov-fail-under=100"
markers      = [
    "live: live API tests (skipped in CI by default)",
]

[tool.mypy]
python_version       = "3.11"
files                = ["src", "tests"]
ignore_missing_imports = true
# Non-strict gate over the whole surface (no per-module exemptions).
# Tighten (disallow_untyped_defs, strict, …) in a follow-up.

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
